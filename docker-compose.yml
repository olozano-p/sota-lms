# Development stack: `docker compose up` gives Postgres, MinIO, the mock IdP and the app with seed
# data. Contributors need no real IdP or credentials. Ports are offset to leave local services alone.
name: lodro

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lodro
      POSTGRES_PASSWORD: lodro
      POSTGRES_DB: lodro
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lodro -d lodro"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lodro
      MINIO_ROOT_PASSWORD: lodro-dev-storage
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the private bucket once MinIO is up.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 lodro lodro-dev-storage &&
      mc mb --ignore-existing local/lodro &&
      mc anonymous set none local/lodro"

  mock-idp:
    image: node:24-alpine
    working_dir: /app
    command: node dev/mock-idp/server.mjs
    environment:
      MOCK_IDP_PORT: "3013"
      MOCK_IDP_ISSUER: http://localhost:3013
      APP_URL: http://localhost:3003
      OIDC_CLIENT_ID: lodro
      OIDC_CLIENT_SECRET: lodro-dev-secret
      ENTITLEMENTS_PULL_TOKEN: lodro-dev-pull-token
      ENTITLEMENTS_WEBHOOK_SECRET: lodro-dev-webhook-secret
    ports:
      - "3013:3013"
    volumes:
      - ./dev:/app/dev:ro
      - ./node_modules:/app/node_modules:ro
      - ./package.json:/app/package.json:ro

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mock-idp:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: "3003"
      APP_URL: http://localhost:3003
      DATABASE_URL: postgres://lodro:lodro@postgres:5432/lodro
      SESSION_SECRET: dev-only-session-secret-please-change-me-0123456789
      OIDC_ISSUER: http://localhost:3013
      OIDC_CLIENT_ID: lodro
      OIDC_CLIENT_SECRET: lodro-dev-secret
      OIDC_END_SESSION_URL: http://localhost:3013/session/end
      OIDC_ROLES_CLAIM: roles
      ENTITLEMENTS_PULL_URL: http://mock-idp:3013/entitlements/v1
      ENTITLEMENTS_PULL_TOKEN: lodro-dev-pull-token
      ENTITLEMENTS_WEBHOOK_SECRET: lodro-dev-webhook-secret
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9010
      S3_REGION: us-east-1
      S3_BUCKET: lodro
      S3_ACCESS_KEY_ID: lodro
      S3_SECRET_ACCESS_KEY: lodro-dev-storage
      S3_FORCE_PATH_STYLE: "true"
      MAIL_TRANSPORT: console
      MAIL_FROM: Lodrö <lms@example.invalid>
      SEED: "true"
    ports:
      - "3003:3003"
    # The browser talks to the IdP on localhost:3013; the container reaches the same service by name.
    extra_hosts:
      - "localhost:host-gateway"

volumes:
  pgdata:
  miniodata:
