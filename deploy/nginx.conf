# Reverse proxy for Lodrö. Two hostnames: the app and the object store (signed URLs point at it).
# TLS termination is yours (certbot/acme.sh); the app sets Secure cookies when APP_URL is https.

limit_req_zone $binary_remote_addr zone=lodro_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=lodro_api:10m rate=240r/m;

server {
    listen 443 ssl http2;
    server_name learn.example.org;
    # ssl_certificate / ssl_certificate_key …

    client_max_body_size 8m;   # uploads go straight to storage, not through the app

    location /auth/ {
        limit_req zone=lodro_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3003;
        include /etc/nginx/lodro-proxy-headers.conf;
    }
    location /api/ {
        limit_req zone=lodro_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3003;
        include /etc/nginx/lodro-proxy-headers.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:3003;
        include /etc/nginx/lodro-proxy-headers.conf;
    }
}

# Object storage (MinIO) for signed GET/PUT. Set S3_PUBLIC_ENDPOINT=https://files.example.org.
server {
    listen 443 ssl http2;
    server_name files.example.org;
    client_max_body_size 0;      # the app enforces its own upload limit before signing
    proxy_request_buffering off;
    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}

