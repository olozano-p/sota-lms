# Reverse proxy for SOTA: one hostname, TLS termination is yours (certbot/acme.sh); the app sets
# Secure cookies when APP_URL is https. Files are served by the app itself (local storage driver),
# so uploads pass through `/api/storage/` and need the larger body size there.

limit_req_zone $binary_remote_addr zone=sota_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=sota_api:10m rate=240r/m;

server {
    listen 443 ssl http2;
    server_name learn.example.org;
    # ssl_certificate / ssl_certificate_key …

    client_max_body_size 8m;

    location /auth/ {
        limit_req zone=sota_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3003;
        include /etc/nginx/sota-proxy-headers.conf;
    }
    # Signed file GET/PUT. The token is the gate; the app enforces lms.config.ts uploads.maxBytes
    # before signing, so match it here and stream instead of buffering the body.
    location /api/storage/ {
        client_max_body_size 200m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3003;
        include /etc/nginx/sota-proxy-headers.conf;
    }
    location /api/ {
        limit_req zone=sota_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3003;
        include /etc/nginx/sota-proxy-headers.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:3003;
        include /etc/nginx/sota-proxy-headers.conf;
    }
}

# Only with STORAGE_DRIVER=s3 and a self-hosted object store on this machine: a second hostname
