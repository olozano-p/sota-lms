<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">SOTA by the numbers</title>
  <desc id="d">Measured on SOTA 1.1.0 on an Apple M1 Pro: cold production build 5.6 seconds; about 200 KB of JavaScript (gzip) for a lesson page; 10 KB of CSS; first paint about 0.1 seconds locally; cold start to healthy about 1 second; about 30 milliseconds to render a signed-in lesson page on the server; a 191 MB compressed container image; 341 tests in about 20 seconds.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; stroke: #e4e0ee; }
      .card { fill: #ffffff; stroke: #e4e0ee; }
      .big { fill: #4b41a3; } .ink { fill: #1d1b30; } .muted { fill: #6b6782; }
      .rule { stroke: #f2a07b; }
      .sans { font-family: Figtree, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .serif { font-family: Fraunces, Georgia, "Times New Roman", serif; }
      .grow { stroke-dasharray: 60; animation: grow 1.2s ease-out backwards; }
      .c2 .grow { animation-delay: .15s } .c3 .grow { animation-delay: .3s } .c4 .grow { animation-delay: .45s }
      .c5 .grow { animation-delay: .6s } .c6 .grow { animation-delay: .75s } .c7 .grow { animation-delay: .9s } .c8 .grow { animation-delay: 1.05s }
      @keyframes grow { from { stroke-dashoffset: 60 } to { stroke-dashoffset: 0 } }
      @media (prefers-reduced-motion: reduce) { .grow { animation: none } }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #121122; stroke: #29263f; }
        .card { fill: #1b1a2f; stroke: #34304f; }
        .big { fill: #bdb4f7; } .ink { fill: #e7e4f3; } .muted { fill: #9d98b8; }
      }
    </style>
  </defs>
  <rect class="bg" x="1" y="1" width="1198" height="338" rx="24" stroke-width="2"/>
  <g class="sans">
    <g class="c1"><rect class="card" x="32" y="32" width="268" height="130" rx="16"/>
      <text x="56" y="88" class="serif big" font-size="40">5.6 s</text>
      <line class="rule grow" x1="56" y1="104" x2="116" y2="104" stroke-width="3" stroke-linecap="round"/>
      <text x="56" y="132" class="ink" font-size="15">cold production build</text>
      <text x="56" y="151" class="muted" font-size="13">vite build, client + server</text></g>
    <g class="c2"><rect class="card" x="316" y="32" width="268" height="130" rx="16"/>
      <text x="340" y="88" class="serif big" font-size="40">~200 KB</text>
      <line class="rule grow" x1="340" y1="104" x2="400" y2="104" stroke-width="3" stroke-linecap="round"/>
      <text x="340" y="132" class="ink" font-size="15">JS for a lesson page</text>
      <text x="340" y="151" class="muted" font-size="13">gzip · 176 KB with brotli</text></g>
    <g class="c3"><rect class="card" x="600" y="32" width="268" height="130" rx="16"/>
      <text x="624" y="88" class="serif big" font-size="40">10 KB</text>
      <line class="rule grow" x1="624" y1="104" x2="684" y2="104" stroke-width="3" stroke-linecap="round"/>
      <text x="624" y="132" class="ink" font-size="15">of CSS, the whole app</text>
      <text x="624" y="151" class="muted" font-size="13">gzip, theme included</text></g>
    <g class="c4"><rect class="card" x="884" y="32" width="284" height="130" rx="16"/>
      <text x="908" y="88" class="serif big" font-size="40">~0.1 s</text>
      <line class="rule grow" x1="908" y1="104" x2="968" y2="104" stroke-width="3" stroke-linecap="round"/>
      <text x="908" y="132" class="ink" font-size="15">first contentful paint</text>
      <text x="908" y="151" class="muted" font-size="13">server-rendered, local network</text></g>
    <g class="c5"><rect class="card" x="32" y="178" width="268" height="130" rx="16"/>
      <text x="56" y="234" class="serif big" font-size="40">~1 s</text>
      <line class="rule grow" x1="56" y1="250" x2="116" y2="250" stroke-width="3" stroke-linecap="round"/>
      <text x="56" y="278" class="ink" font-size="15">cold start to healthy</text>
      <text x="56" y="297" class="muted" font-size="13">node scripts/serve.mjs</text></g>
    <g class="c6"><rect class="card" x="316" y="178" width="268" height="130" rx="16"/>
      <text x="340" y="234" class="serif big" font-size="40">~30 ms</text>
      <line class="rule grow" x1="340" y1="250" x2="400" y2="250" stroke-width="3" stroke-linecap="round"/>
      <text x="340" y="278" class="ink" font-size="15">to render a lesson</text>
      <text x="340" y="297" class="muted" font-size="13">signed in, access checked</text></g>
    <g class="c7"><rect class="card" x="600" y="178" width="268" height="130" rx="16"/>
      <text x="624" y="234" class="serif big" font-size="40">191 MB</text>
      <line class="rule grow" x1="624" y1="250" x2="684" y2="250" stroke-width="3" stroke-linecap="round"/>
      <text x="624" y="278" class="ink" font-size="15">container image</text>
      <text x="624" y="297" class="muted" font-size="13">compressed · Node 24 Alpine</text></g>
    <g class="c8"><rect class="card" x="884" y="178" width="284" height="130" rx="16"/>
      <text x="908" y="234" class="serif big" font-size="40">341 tests</text>
      <line class="rule grow" x1="908" y1="250" x2="968" y2="250" stroke-width="3" stroke-linecap="round"/>
      <text x="908" y="278" class="ink" font-size="15">in about 20 seconds</text>
      <text x="908" y="297" class="muted" font-size="13">vitest on in-memory Postgres</text></g>
  </g>
</svg>
