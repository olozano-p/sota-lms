# Production reference: the app image plus Postgres on one host, files on a volume, behind your
# reverse proxy (deploy/nginx.conf). Copy `.env.example` to `.env`, fill the secrets and run:
#   docker compose -f docker-compose.prod.yml up -d --build
# Managed services: point DATABASE_URL at your Postgres and drop the `postgres` service; set
# STORAGE_DRIVER=s3 with the S3_* block and drop the `uploads` volume.
name: sota-prod

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3003"
      TRUST_PROXY: "true"
      MIGRATE: "true"
      SEED: "false"
      STORAGE_DIR: /app/data/uploads
    ports:
      - "127.0.0.1:3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Your fork's deployment config; comment out to use the image's lms.config.ts.
      - ./lms.config.ts:/app/lms.config.ts:ro
      - uploads:/app/data/uploads

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sota}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sota}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  uploads:
