<!doctype html>
<html>
  <body
    style="margin:0;padding:24px;background:{{color.paper}};color:{{color.ink}};font:14px/1.6 {{font.sans}}"
  >
    <div
      style="max-width:560px;margin:0 auto;border:1px dashed {{color.primary}};border-radius:16px;padding:24px"
    >
      <p style="margin:0 0 12px;color:{{color.primary}}">$ {{brand}} --notify</p>
      <h1 style="font-size: 18px; font-weight: normal; margin: 0 0 16px">{{title}}</h1>
      {{{lines}}}
      <p style="margin: 24px 0 0">
        <a
          href="{{ctaUrl}}"
          style="display:inline-block;padding:8px 14px;background:{{color.primary}};color:{{color.primaryForeground}};text-decoration:none;border-radius:12px"
          >&gt; {{ctaLabel}}</a
        >
      </p>
    </div>
  </body>
</html>
