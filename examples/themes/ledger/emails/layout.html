<!doctype html>
<html>
  <body
    style="margin:0;padding:24px;background:{{color.paper}};color:{{color.ink}};font:16px/1.5 {{font.serif}}"
  >
    <div
      style="max-width:560px;margin:0 auto;background:{{color.paper}};border:3px double {{color.border}};padding:28px"
    >
      <p
        style="margin:0 0 4px;font:11px {{font.sans}};letter-spacing:.12em;text-transform:uppercase;color:{{color.muted}}"
      >
        {{brand}}
      </p>
      <h1 style="font-size: 24px; font-weight: normal; font-variant: small-caps; margin: 0 0 16px">
        {{title}}
      </h1>
      {{{lines}}}
      <p style="margin: 24px 0 0">
        <a
          href="{{ctaUrl}}"
          style="display:inline-block;padding:10px 16px;background:{{color.primary}};color:{{color.primaryForeground}};text-decoration:none;font-size:14px"
          >{{ctaLabel}}</a
        >
      </p>
    </div>
  </body>
</html>
