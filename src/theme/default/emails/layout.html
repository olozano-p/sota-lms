<!doctype html>
<html>
  <body
    style="margin:0;padding:24px;background:{{color.paper}};color:{{color.ink}};font:16px/1.4 {{font.serif}}"
  >
    <div
      style="max-width:560px;margin:0 auto;background:{{color.card}};border-radius:16px;padding:28px"
    >
      <h1 style="font-size: 24px; font-weight: 500; line-height: 1.2; margin: 0 0 16px">
        {{title}}
      </h1>
      {{{lines}}}
      <p style="margin: 24px 0 0">
        <a
          href="{{ctaUrl}}"
          style="display:inline-block;padding:16px;background:{{color.tint}};color:{{color.ink}};text-decoration:none;border-radius:8px;font:600 12px/1.2 {{font.sans}};letter-spacing:0.1em;text-transform:uppercase"
          >{{ctaLabel}}</a
        >
      </p>
    </div>
    <p
      style="max-width:560px;margin:16px auto 0;font:500 12px/1.2 {{font.sans}};letter-spacing:0.1em;text-transform:uppercase;color:{{color.muted}}"
    >
      {{brand}}
    </p>
  </body>
</html>
