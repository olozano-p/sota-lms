<!doctype html>
<html>
  <body
    style="margin:0;padding:24px;background:{{color.paper}};color:{{color.ink}};font:16px/1.5 {{font.serif}}"
  >
    <div
      style="max-width:560px;margin:0 auto;background:{{color.paper}};border:1px solid {{color.border}};border-radius:8px;padding:28px"
    >
      <h1 style="font-size: 22px; font-weight: 500; margin: 0 0 16px">{{title}}</h1>
      {{{lines}}}
      <p style="margin: 24px 0 0">
        <a
          href="{{ctaUrl}}"
          style="display:inline-block;padding:10px 16px;background:{{color.primary}};color:{{color.primaryForeground}};text-decoration:none;border-radius:4px;font-family:{{font.sans}};font-size:14px"
          >{{ctaLabel}}</a
        >
      </p>
    </div>
    <p style="max-width:560px;margin:16px auto 0;font:12px {{font.sans}};color:{{color.muted}}">
      {{brand}}
    </p>
  </body>
</html>
