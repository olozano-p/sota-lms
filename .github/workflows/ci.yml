name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the whole pipeline before it publishes an image.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request supersedes the run in progress; main and release runs always finish.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sota
          POSTGRES_PASSWORD: sota
          POSTGRES_DB: sota
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sota" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm test
      - name: Example themes validate
        run: for theme in examples/themes/*; do pnpm sota validate-theme "$theme" --strict; done
      - name: Workflows lint (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Migration dry-run
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://sota:sota@localhost:5432/sota
      - name: Drizzle schema is in sync with migrations
        run: |
          pnpm db:generate
          git diff --exit-code -- drizzle || (echo "Run pnpm db:generate and commit the migration" && exit 1)

  # Runs beside `checks`, not after it: the stack builds the production Dockerfile, so a broken
  # image fails here too.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: docker compose -f compose.dev.yml up -d --build
      # The app migrates and seeds before it listens; the first test would hit a closed port.
      - name: Wait for the app
        run: curl -sf --retry 60 --retry-delay 2 --retry-all-errors -o /dev/null http://localhost:3003/api/health
      - run: pnpm e2e
      - if: failure()
        run: docker compose -f compose.dev.yml logs app mock-idp
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Contributors from forks rarely have the local hooks installed; the same script runs here.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit messages follow the gitmoji convention
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            sh .githooks/commit-msg "$RUNNER_TEMP/msg" || status=1
          done
          exit $status

  # New or upgraded dependencies with a known high-severity advisory, or a licence that does not fit
  # an MIT project, fail the pull request.
  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, SSPL-1.0
