# Development stack: `docker compose -f compose.dev.yml up` gives Postgres, the mock IdP and the app with seed data.
# Files live on a volume (local storage driver). Contributors need no real IdP or credentials.
# Ports are offset to leave local services alone.
name: sota

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sota
      POSTGRES_PASSWORD: sota
      POSTGRES_DB: sota
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sota -d sota"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-idp:
    image: node:24-alpine
    working_dir: /app
    command: node dev/mock-idp/server.mjs
    environment:
      MOCK_IDP_PORT: "3013"
      MOCK_IDP_ISSUER: http://localhost:3013
      APP_URL: http://localhost:3003
      OIDC_CLIENT_ID: sota
      OIDC_CLIENT_SECRET: sota-dev-secret
      ENTITLEMENTS_PULL_TOKEN: sota-dev-pull-token
      WEBHOOK_HMAC_SECRET: sota-dev-webhook-secret
    ports:
      - "3013:3013"
    volumes:
      - ./dev:/app/dev:ro
      - ./node_modules:/app/node_modules:ro
      - ./package.json:/app/package.json:ro

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      mock-idp:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: "3003"
      APP_URL: http://localhost:3003
      DATABASE_URL: postgres://sota:sota@postgres:5432/sota
      SESSION_SECRET: dev-only-session-secret-please-change-me-0123456789
      AUTH_MODE: oidc
      OIDC_ISSUER: http://localhost:3013
      OIDC_CLIENT_ID: sota
      OIDC_CLIENT_SECRET: sota-dev-secret
      OIDC_ROLES_CLAIM: roles
      ENTITLEMENT_CLAIM: enrollments
      ENTITLEMENTS_PULL_URL: http://mock-idp:3013/entitlements/v1
      ENTITLEMENTS_PULL_TOKEN: sota-dev-pull-token
      WEBHOOK_HMAC_SECRET: sota-dev-webhook-secret
      API_SERVICE_TOKEN: sota-dev-service-token-0123456789abcdef
      STORAGE_DRIVER: local
      STORAGE_DIR: /app/data/uploads
      MAIL_TRANSPORT: console
      MAIL_FROM: SOTA <lms@example.invalid>
      SEED: "true"
    ports:
      - "3003:3003"
    volumes:
      - uploads:/app/data/uploads
    # The browser talks to the IdP on localhost:3013; the container reaches the same service by name.
    extra_hosts:
      - "localhost:host-gateway"

volumes:
  pgdata:
  uploads:
